name: Build EternalMangas

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build EternalMangas
        run: ./gradlew :src:es:eternalmangas:assembleDebug --no-daemon

      - name: Find APK
        id: apk
        run: |
          APK=$(find src/es/eternalmangas/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EternalMangas-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
